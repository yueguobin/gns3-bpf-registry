name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["registry-v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install tcpdump
        run: sudo apt-get update && sudo apt-get install -y tcpdump
      - name: Show tool versions
        run: |
          tcpdump --version
          python --version
          pip --version
      - name: Install Python dependencies
        run: pip install -r tools/requirements.txt
      - name: Crosscheck registry offsets against scapy
        run: python tools/crosscheck.py
      - name: Check auto-draft probes for registry drift
        run: python tools/auto_draft.py --check
      - name: Verify schema, expressions and fixture replay
        run: python tools/verify.py
      - name: Check generated fixtures
        run: python tools/make_fixtures.py --check
      - name: Check manifest
        run: python tools/make_manifest.py --check
      - name: Check golden vectors
        run: python tools/make_vectors.py --check
