<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BPF Expression Visual Calculator</title>
<style>
  :root{
    --bg:#f8fafc; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  }
  *{box-sizing:border-box; margin:0}
  body{font:14px/1.5 system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); padding:20px; max-width:1180px; margin:0 auto}
  h1{font-size:18px; margin-bottom:4px}
  .sub{color:var(--muted); font-size:12px; margin-bottom:14px}
  /* ---- two-column layout: construction on the left, sticky brick rail on the right.
         The rail is a full-viewport sticky column; the palette card is flex-centered
         INSIDE it — deterministic screen-centering, no transform math, never clipped. ---- */
  .layout{display:flex; gap:14px; align-items:flex-start}
  .main{flex:1; min-width:0}
  .sidebar{flex:none; width:172px; position:sticky; top:0; height:100vh;
    display:flex; align-items:center; margin-bottom:-100vh}
  .sidebar .card{width:100%; margin:0; max-height:calc(100vh - 24px); overflow-y:auto}
  @media (max-width:920px){
    .layout{flex-direction:column-reverse}
    .sidebar{position:static; height:auto; margin-bottom:0}
    .sidebar .card{max-height:none; overflow:visible}
  }
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .card h2{font-size:13px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px}
  button{font:inherit; border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 10px; cursor:pointer}
  button:hover{border-color:#94a3b8}
  .palette{display:flex; flex-direction:column; gap:4px}
  .palfilter{width:100%; padding:5px 8px; border:1px solid var(--line); border-radius:6px;
    font:inherit; font-size:12px; margin-bottom:8px; outline:none}
  .palfilter:focus{border-color:#94a3b8}
  /* Family header mirrors the brick geometry — same height, same left hue
     strip and hover — so collapsed groups and the bricks under them read as
     one component family instead of a thin label row vs chunky buttons. */
  .pgroup{margin-bottom:10px}
  .pgrouplab{display:flex; align-items:center; gap:8px; padding:10px;
    border:1px solid var(--line); border-left:4px solid var(--fc); border-radius:8px;
    background:color-mix(in srgb, var(--fc) 6%, #fff); cursor:pointer; user-select:none;
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em}
  .pgrouplab:hover{border-color:#94a3b8; background:color-mix(in srgb, var(--fc) 14%, #fff)}
  .pgrouplab .arr{font-size:9px; width:10px; flex:none}
  .pgrouplab .cnt{margin-left:auto; color:var(--muted); font-size:10px; font-weight:600}
  .pgroup .pbtns{display:flex; flex-direction:column; gap:6px; padding-top:6px}
  .pgroup:not(.open) .pbtns{display:none}
  .palette button{border-left:4px solid var(--pc); text-align:left; padding:8px 10px;
    background:color-mix(in srgb, var(--pc) 6%, #fff)}
  .palette button:hover{background:color-mix(in srgb, var(--pc) 16%, #fff)}
  @media (max-width:920px){
    .palette{flex-direction:row; flex-wrap:wrap}
    .pgroup{flex-direction:row; flex-wrap:wrap}
  }
  /* ---- boolean columns: each column is one operand of the final
         expression; columns stack vertically full-width and operator
         bars sit between adjacent columns ---- */
  .cols{display:flex; flex-direction:column; gap:10px}
  .col{display:flex; flex-direction:column; border-radius:10px;
    outline:2px solid transparent; outline-offset:2px}
  .col.on{outline-color:#cbd5e1}
  .colhead{display:flex; align-items:center; gap:6px; padding:0 2px 4px;
    font-size:10px; color:var(--muted); font-family:ui-monospace,monospace}
  .colhead .x{margin-left:auto; cursor:pointer; font-size:13px; color:var(--muted); padding:0 4px}
  .colhead .x:hover{color:#0f172a}
  .colempty{flex:1; border:2px dashed var(--line); border-radius:10px; padding:18px 12px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    color:var(--muted); font-size:12px}
  .col.droptarget .colempty{border-color:#0f172a; color:var(--ink)}
  /* Operator bar: full-width divider between vertically stacked columns —
     rule lines both sides, the pill in the middle keeps the and/or/not hue. */
  .opbar{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;
    font:700 13px/1 ui-monospace,monospace}
  .opbar::before,.opbar::after{content:""; flex:1; border-top:2px solid var(--line)}
  .opbar b{padding:5px 18px; border-radius:99px; border:1px solid var(--line); background:#fff;
    min-width:52px; text-align:center}
  .opbar.and::before,.opbar.and::after{border-color:#bbf7d0}
  .opbar.or::before,.opbar.or::after{border-color:#bfdbfe}
  .opbar.not::before,.opbar.not::after{border-color:#fecaca}
  .opbar.and b{color:#166534; background:#f0fdf4; border-color:#bbf7d0}
  .opbar.or b{color:#1d4ed8; background:#eff6ff; border-color:#bfdbfe}
  .opbar.not b{color:#991b1b; background:#fef2f2; border-color:#fecaca}
  .opbar:hover b{border-color:#94a3b8}
  .addcol{padding:9px 0; border:2px dashed var(--line); border-radius:10px; background:none;
    color:var(--muted); font-size:20px; line-height:1; cursor:pointer}
  .addcol:hover{border-color:#94a3b8; color:var(--ink)}
  .lrow.dropb{box-shadow:0 -4px 0 #0f172a}
  .lrow.dropa{box-shadow:0 4px 0 #0f172a}
  /* ---- vertical stack: each protocol is one rectangular brick ---- */
  .lrow{border:2px solid var(--lc); border-radius:10px; margin-bottom:8px;
    background:color-mix(in srgb, var(--lc) 5%, #fff)}
  .lrow.sel{outline:2px solid #0f172a; outline-offset:-2px}
  .lhead{display:flex; align-items:center; gap:10px; padding:6px 10px;
    background:var(--lc); color:#fff; border-radius:7px 7px 0 0; cursor:grab}
  .lhead b{color:#fff}
  .lhead .meta{color:rgba(255,255,255,.85); font-size:11px; font-family:ui-monospace,monospace}
  /* Padded delete zone: generous hit area that never arms a drag. */
  .lhead .del{margin-left:auto; margin-right:-8px; padding:6px 10px; border-radius:6px;
    color:rgba(255,255,255,.85); cursor:pointer}
  .lhead .del:hover{color:#fff}
  /* ---- RFC-style 32-bit word grid ---- */
  .pwrap{display:flex; padding:12px 10px 10px; overflow-x:auto}
  .gut{flex:none; width:34px; display:flex; flex-direction:column}
  .gut span{height:38px; font-size:9px; color:var(--muted); font-family:ui-monospace,monospace;
    display:flex; align-items:center; justify-content:flex-end; padding-right:6px; border-right:1px solid var(--line)}
  .pbody{flex:1; min-width:760px}
  .pruler{margin-bottom:2px; height:30px}
  .p32{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:10px; margin-bottom:1px; height:15px}
  .p32::before,.p32::after{content:""; flex:1; border-top:1px solid var(--muted); position:relative; top:0}
  .p32 .ah{color:var(--muted)}
  .pticks{display:grid; grid-template-columns:repeat(4,1fr); color:var(--muted); font-size:9px; font-family:ui-monospace,monospace; height:13px}
  .pticks span{text-align:center; border-left:1px solid var(--line); padding:1px 0}
  .pticks span:first-child{border-left:none}
  .pgridrow{display:grid; grid-template-columns:repeat(32,1fr); grid-auto-rows:38px}
  .pfullrow{display:flex}
  .pfullrow .pc{flex:1; height:38px}
  .pc{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    border:1.5px solid color-mix(in srgb, var(--lc) 55%, #fff);
    background:color-mix(in srgb, var(--lc) 9%, #fff);
    font-size:10.5px; line-height:1.15; text-align:center; cursor:pointer; overflow:hidden; padding:1px 2px;
    min-width:0}
  .pc:hover{background:color-mix(in srgb, var(--lc) 20%, #fff)}
  .pc.on{background:color-mix(in srgb, var(--lc) 30%, #fff); box-shadow:inset 0 0 0 2px var(--lc); font-weight:600}
  .pc .bw{font-size:8.5px; color:var(--muted); font-family:ui-monospace,monospace}
  .pc .pv{font-weight:700; font-size:10px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pc .pl{font-size:8.5px; color:var(--muted); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pc .cont{color:var(--muted); font-size:9px}
  .pc .pb{font-style:normal; font-size:8px; color:#166534; background:#dcfce7; border:1px solid #bbf7d0;
    border-radius:3px; padding:0 3px; line-height:1.3}
  .pc .mini{display:flex; gap:1px; width:100%; justify-content:center; padding:0 1px}
  .pc .mini i{font-style:normal; font-size:8.5px; border:1px solid color-mix(in srgb, var(--lc) 55%, #fff);
    border-radius:2px; flex:1; max-width:26px; min-width:0; background:#fff; line-height:1.5; overflow:hidden;
    cursor:pointer}
  .pc .mini i:hover{background:color-mix(in srgb, var(--lc) 25%, #fff)}
  .pc .mini i.on{background:var(--lc); color:#fff; font-weight:700}
  .pc.excl{border-style:dashed; border-color:#cbd5e1; background:#f1f5f9; color:var(--muted); cursor:help}
  .pc.tail{border:1.5px dashed #cbd5e1; color:var(--muted); cursor:help; font-size:10px;
    background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 6px,#f1f5f9 6px,#f1f5f9 12px)}
  /* ---- tunnel payload nesting: inner packet lives INSIDE the tunnel envelope ---- */
  .innerbox{margin:0 10px 10px 26px; border:2px solid var(--tc); border-radius:8px;
    background:color-mix(in srgb, var(--tc) 4%, #fff); padding:8px}
  .innerlab{font-size:11px; color:var(--tc); margin-bottom:6px; font-weight:600}
  .innerbox .lrow{margin-bottom:6px}
  /* ---- in-cell editing ---- */
  .pc.editing{overflow:visible; z-index:20; box-shadow:inset 0 0 0 2px #0f172a}
  .pc>input,.pc>select{position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff;
    font-size:10.5px; font-family:inherit; text-align:center; padding:0 2px; outline:none; border-radius:4px}
  .total{margin-top:6px; font-size:12px; color:var(--muted); font-family:ui-monospace,monospace; text-align:right}
  /* ---- chips / expr ---- */
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chip{display:inline-flex; gap:6px; align-items:center; border:1px solid var(--line); background:#fff; border-radius:99px; padding:3px 10px; font-size:12px}
  .chip .x{cursor:pointer; color:var(--muted)}
  .chip.guard{border-color:#fda4af; background:#fff1f2}
  .chip.field{border-color:#bfdbfe; background:#eff6ff}
  .chip.warn{border-color:#fde047; background:#fefce8}
  .chip.hint{border-color:#bae6fd; background:#f0f9ff}
  .expr{font-family:ui-monospace,monospace; background:#0f172a; color:#e2e8f0; border-radius:8px; padding:12px; font-size:13px; word-break:break-all; white-space:pre-wrap}
  .mode{display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px; margin-left:8px; vertical-align:middle}
  .mode.native{background:#dcfce7; color:#166534}
  .mode.drill{background:#fee2e2; color:#991b1b}
  .langbtn{font-size:11px; padding:2px 10px; border-radius:99px; margin-left:8px; vertical-align:middle; background:#fff}
  .note{font-size:11px; color:var(--muted); margin-top:8px}
  /* ---- boot loading: spinner + progress while the registry streams in ---- */
  .loading{display:flex; flex-direction:column; align-items:center; gap:10px; padding:44px 20px;
    color:var(--muted); font-size:13px}
  .spinner{width:26px; height:26px; border-radius:50%; border:3px solid var(--line);
    border-top-color:#0f172a; animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loadbar{width:220px; height:4px; border-radius:99px; background:var(--line); overflow:hidden}
  .loadbar i{display:block; height:100%; width:0%; background:#0f172a; border-radius:99px;
    transition:width .2s ease}
</style>
</head>
<body>
<h1><span id="tTitle">BPF Expression Visual Calculator</span> <span id="modeBadge" class="mode native">Native</span> <button id="langBtn" class="langbtn" onclick="toggleLang()">Chinese</button></h1>
<div class="sub" id="tSub"></div>

<div class="layout">
  <div class="main">
    <div class="card">
      <h2 id="tSec1"></h2>
      <div id="stack" class="cols"><div class="loading"><div class="spinner"></div><div id="loadText"></div><div class="loadbar"><i id="loadFill"></i></div></div></div>
    </div>

    <div class="card">
      <h2 id="tSec2"></h2>
      <div class="chips" id="chips"></div>
    </div>

    <div class="card">
      <h2 id="tSec3"></h2>
      <div class="expr" id="expr"></div>
      <div class="note" id="exprNote"></div>
    </div>
  </div>

  <div class="sidebar">
    <div class="card">
      <h2 id="tPal"></h2>
      <div class="palette" id="palette"></div>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="overlay.js"></script>
<script>
/* i18n chrome (STR, T, L, LANG) lives in i18n.js; per-protocol UI data
   (FAM, UI, SYN — with their inline {en, zh} objects) in overlay.js.
   This file holds markup and logic only: tools/check_i18n.py fails on
   any CJK codepoint here, so a hover or label cannot ship untranslated. */
function toggleLang(){ LANG = LANG==="en" ? "zh" : "en"; try{ localStorage.setItem("bpfcalc-lang", LANG); }catch(e){}
  renderChrome();
  if(ready) renderAll();
  else{ const t = document.getElementById("loadText"); if(t) t.textContent = T("loading"); } }  // still booting: keep the spinner label fresh
function renderChrome(){
  document.title = T("title");
  document.getElementById("tTitle").textContent = T("title");
  document.getElementById("tSub").textContent = T("sub");
  document.getElementById("tSec1").textContent = T("sec1");
  document.getElementById("tSec2").textContent = T("sec2");
  document.getElementById("tSec3").textContent = T("sec3");
  document.getElementById("tPal").textContent = T("pal");
  document.getElementById("langBtn").textContent = T("langOther");
  document.documentElement.lang = LANG==="en" ? "en" : "zh-CN";
}
/* FAM (palette families), UI (per-protocol overlay) and SYN (synthetic
   bricks) live in overlay.js: they are data carrying inline {en, zh}
   objects, while this file stays markup + logic only. The bricks are
   derived from registry/*.json at runtime — there is no hand-maintained
   field mirror to drift. */

const hexInt = v => typeof v==="string" ? parseInt(v, 16) : v;

function regToEntry(reg){
  const ui = UI[reg.id] || {};
  const fields = reg.fields.map(f=>{
    const fo = {id:f.id, label:f.label, off:f.offset, len:f.size, kind:f.kind, emitKind:f.kind};
    if(f.mask){ fo.mask = hexInt(f.mask); fo.win = f.size; fo.shift = f.shift || 0; }
    if(f.min != null) fo.min = f.min;
    if(f.max != null) fo.max = f.max;
    if(ui.kindOverride && ui.kindOverride[f.id]) fo.kind = ui.kindOverride[f.id];  // input flavor only
    if(f.values){
      fo.values = f.values.map(v=>({v:v.value, l:v.label}));
      if(ui.enumAdds && ui.enumAdds[f.id]) fo.values = fo.values.concat(ui.enumAdds[f.id]);
    }
    if(f.bits) fo.bits = f.bits.map(b=>({m:b.mask, l:b.label}));
    if(f.emit) fo.emit = f.emit;
    if(f.description) fo.description = f.description;
    if(ui.successors && ui.successors[f.id]) fo.successor = ui.successors[f.id];
    return fo;
  });
  const excluded = [];
  for(const x of reg.excluded || []){
    const p = ui.primitives && ui.primitives[x.id];
    if(p){
      // clickable primitive cell placed at the excluded bytes (port / host)
      const pf = {id:x.id, label:p.label || x.id, off:x.offset, len:x.length,
                  kind:p.kind, emitKind:p.kind,
                  excl:{reason:x.reason, primitive:p.p}};
      if(ui.successors && ui.successors[x.id]) pf.successor = ui.successors[x.id];
      fields.push(pf);
    }else{
      const label = (ui.exclLabels && ui.exclLabels[x.id]) || x.id;
      excluded.push({off:x.offset, len:x.length, label, reason:x.reason});
    }
  }
  fields.sort((a,b)=>a.off-b.off);   // stable: registry declaration order wins offset ties
  const e = {label:reg.label, len:reg.headerLength, anchor:reg.anchor.header, base:reg.anchor.base,
             fam:ui.fam || "custom", fields, excluded};
  if(reg.locator && reg.locator.length) e.locator = reg.locator;
  if(ui.tail) e.tail = ui.tail;
  if(ui.tunnel) e.tunnel = true;
  if(ui.pin){ e.pin = ui.pin; e.pinYield = ui.pinYield || []; if(ui.pinWarn) e.pinWarn = ui.pinWarn; }
  return e;
}

let ENTRIES = {}, ready = false;
async function loadEntries(){
  const text = document.getElementById("loadText"), fill = document.getElementById("loadFill");
  // registry/ sits BESIDE the page in the flat Pages bundle (pages.yml copies
  // index.html and registry/ into one directory) but one level UP when the
  // repo root is served (page at /prototype/, registry at /registry/) — probe
  // both instead of guessing the layout; "" first so the deployed path stays
  // probe-free and only local serving eats the extra 404.
  const getJSON = async url => { const r = await fetch(url); if(!r.ok) throw new Error(url); return r.json(); };
  let manifest = null, base = null;
  for(const b of ["", "../"]){
    try{ manifest = await getJSON(b + "registry/manifest.json"); base = b; break; }catch(e){}
  }
  if(!manifest) throw new Error("registry/ not reachable beside or above the page");
  const ids = Object.keys(manifest.files).sort();
  let done = 0;
  // Parallel fetch: entry files are independent, so one round-trip serves
  // all of them instead of one RTT per file; progress text counts resolved
  // responses so the user sees the registry streaming in.
  const regs = await Promise.all(ids.map(file =>
    getJSON(base + "registry/" + file).then(reg=>{
      done++;
      if(text) text.textContent = T("loadingProg")(done, ids.length);
      if(fill) fill.style.width = Math.round(done*100/ids.length) + "%";
      return reg;
    })
  ));
  for(const reg of regs){
    if(reg.id === "vlan") continue;             // primitive-only entry; the synthetic brick renders the tag
    ENTRIES[reg.id] = regToEntry(reg);
  }
  ENTRIES.vlan = SYN.vlan;
  ENTRIES.custom = SYN.custom;
}
/* One hue per brick: cells inherit the layer color (--lc, set on .lrow);
   field KIND no longer participates in coloring. */
let groups = [{uid:1, op:null, layers:[]}], sels = [], editing = null;   // editing: {uid, fid}
let selLayer = null, selGroup = 1, uidSeq = 0, gseq = 1;
let famOpen = "link", palFilter = "";     // rail accordion: the ONE expanded family + search
let drag = null, dropAt = null;           // brick run being dragged + remembered insert point

/* ---------- column / stack helpers ----------
   The construction is a list of COLUMNS (groups): each column is one operand
   of the final boolean expression, g.op is the operator joining the column
   to its LEFT neighbour ("and" | "or" | "not"; null on the first column).
   Layers and selections stay uid-keyed, so bricks carry their field values
   when dragged across columns. */
const activeGroup = () => groups.find(g=>g.uid===selGroup) || groups[0];
function groupOf(uid){ return groups.find(g=>g.layers.some(l=>l.uid===uid)); }
function stackOf(uid){ const g = groupOf(uid); return g ? g.layers : []; }
function layerById(uid){ for(const g of groups){ const l = g.layers.find(x=>x.uid===uid); if(l) return l; } return null; }
function tunnelIdx(st){ return st.findIndex(s=>ENTRIES[s.eid].tunnel); }
function prefix(st, i){ let n=0; for(let k=0;k<i;k++) n+=st[k].len; return n; }

/* ---------- stack ops ---------- */
function addLayer(eid){
  const g = activeGroup();
  g.layers.push({uid:++uidSeq, eid, len:ENTRIES[eid].len});
  selLayer = g.layers[g.layers.length-1].uid; selGroup = g.uid; renderAll();
}
function delLayer(uid){
  for(const g of groups) g.layers = g.layers.filter(s=>s.uid!==uid);
  sels = sels.filter(s=>s.uid!==uid);
  if(selLayer===uid) selLayer=null;
  if(editing && editing.uid===uid) editing=null;
  renderAll();
}
function addColumn(){ groups.push({uid:++gseq, op:"and", layers:[]}); selGroup = gseq; renderAll(); }
function delColumn(gid){
  const i = groups.findIndex(g=>g.uid===gid); if(i<0) return;
  const killed = groups[i].layers.map(l=>l.uid);
  groups.splice(i,1);
  if(!groups.length) groups.push({uid:++gseq, op:null, layers:[]});
  sels = sels.filter(s=>!killed.includes(s.uid));
  if(killed.includes(selLayer)) selLayer=null;
  if(editing && killed.includes(editing.uid)) editing=null;
  if(selGroup===gid) selGroup = groups[Math.max(0, i-1)].uid;
  renderAll();
}
function cycleOp(gid){
  const g = groups.find(x=>x.uid===gid); if(!g || !g.op) return;
  g.op = g.op==="and" ? "or" : g.op==="or" ? "not" : "and";
  renderAll();
}
function colClick(gid){
  selGroup = gid;
  document.querySelectorAll(".col").forEach(c=>c.classList.toggle("on", +c.dataset.gid===gid));
}
/* ---------- brick drag & drop: the label strip arms the drag (minus the
   × delete zone); rows take precise insertions, column bodies take appends ---------- */
function armDrag(ev, row){
  // Only the label strip starts a drag — cells must keep click/dblclick,
  // and the padded × delete zone stays a pure click target: pressing it
  // deletes the brick instead of dragging it out from under the cursor.
  row.draggable = !!ev.target.closest(".lhead") && !ev.target.closest(".del");
}
function dragStart(ev, uid){
  const st = stackOf(uid), ti = tunnelIdx(st), li = st.findIndex(s=>s.uid===uid);
  // A tunnel envelope carries its whole inner-packet run with it.
  drag = {uids: ti>=0 && li===ti ? st.slice(ti).map(s=>s.uid) : [uid]};
  ev.dataTransfer.effectAllowed = "move";
  try{ ev.dataTransfer.setData("text/plain", drag.uids.join(",")); }catch(e){}
}
function dragEnd(){ drag=null; dropAt=null; clearDrops(); }
function clearDrops(){
  document.querySelectorAll(".dropb,.dropa").forEach(el=>el.classList.remove("dropb","dropa"));
  document.querySelectorAll(".col.droptarget").forEach(el=>el.classList.remove("droptarget"));
}
function rowDragOver(ev, uid){
  if(!drag || drag.uids.includes(uid)) return;
  ev.preventDefault(); ev.stopPropagation(); ev.dataTransfer.dropEffect="move";
  const r = ev.currentTarget.getBoundingClientRect();
  const before = ev.clientY < r.top + r.height/2;
  clearDrops(); ev.currentTarget.classList.add(before?"dropb":"dropa");
  dropAt = {uid, before};
}
function rowDrop(ev){ ev.preventDefault(); ev.stopPropagation(); if(dropAt) dropMove(dropAt.uid, dropAt.before); }
function colDragOver(ev){
  if(!drag) return;
  ev.preventDefault(); ev.dataTransfer.dropEffect="move";
  clearDrops(); dropAt=null;
  ev.currentTarget.classList.add("droptarget");
}
function colDrop(ev){
  ev.preventDefault();
  if(drag) dropAppend(+ev.currentTarget.dataset.gid);
}
function pullLayers(uids){
  const out = [];
  for(const g of groups)
    g.layers = g.layers.filter(l=>{ if(uids.includes(l.uid)){ out.push(l); return false; } return true; });
  return out.sort((a,b)=>uids.indexOf(a.uid)-uids.indexOf(b.uid));
}
function dropMove(targetUid, before){
  if(!drag || drag.uids.includes(targetUid)) return;
  const moved = pullLayers(drag.uids);
  const st = stackOf(targetUid), ti = st.findIndex(s=>s.uid===targetUid);
  if(ti>=0) st.splice(before?ti:ti+1, 0, ...moved);
  selGroup = groupOf(targetUid).uid; drag=null; dropAt=null; renderAll();
}
function dropAppend(gid){
  const g = groups.find(x=>x.uid===gid); if(!g || !drag) return;
  // pullLayers() reassigns g.layers (filter) — resolve the moved run FIRST,
  // or push() would land on the stale pre-filter array.
  const moved = pullLayers(drag.uids);
  g.layers.push(...moved);
  selGroup = gid; drag=null; dropAt=null; renderAll();
}

/* ---------- expression compile (verified against bpf_compile.py) ---------- */
function hex(v){return "0x"+v.toString(16)}
function ip2int(s){return s.split(".").reduce((a,o)=>(a<<8)+ +o,0)>>>0}
function mac2int(s){return parseInt(s.replace(/:/g,""),16)}
/* Expand any RFC 4291 group-hex text form (including "::" compression)
   to the four 32-bit words of the 128-bit address, or null if not an
   address. Group-hex only: embedded dotted-quad tails are rejected —
   registry values are always group-hex. Mirrors parse_ipv6 in
   bpf_compile.py for registry values. */
function ipv6words(s){
  if(typeof s!=="string"||!s.includes(":")) return null;
  let g;
  const halves=s.split("::");
  if(halves.length===2){
    const l=halves[0]?halves[0].split(":"):[], r=halves[1]?halves[1].split(":"):[];
    if(l.length+r.length>8) return null;
    g=l.concat(Array(8-l.length-r.length).fill("0")).concat(r);
  }else if(halves.length===1){ g=s.split(":"); if(g.length!==8) return null; }
  else return null;
  if(g.some(x=>!/^[0-9a-fA-F]{1,4}$/.test(x))) return null;
  return [0,1,2,3].map(i=>((parseInt(g[i*2],16)<<16)|parseInt(g[i*2+1],16))>>>0);
}
function ipv4val(raw){ return raw.split(".").length===4 ? ip2int(raw) : parseInt(raw,0); }
function fieldClause(st, sel){
  const li = st.findIndex(s=>s.uid===sel.uid); if(li<0) return null;
  const layer = st[li], e = ENTRIES[layer.eid], f = e.fields.find(x=>x.id===sel.fid);
  const ti = tunnelIdx(st), drill = ti>=0 && li>ti;
  if(!drill && f.excl && f.excl.primitive)
    return f.excl.primitive+" "+sel.dispVal;
  const win = f.win||f.len;
  let val;
  if(f.kind==="enum") val = sel.val;
  else if(f.kind==="ipv4") val = ipv4val(sel.dispVal);
  else if(f.kind==="mac"){
    const m = mac2int(sel.dispVal);
    const hi = Math.floor(m / 0x10000), lo = m % 0x10000;
    const o = drill? prefix(st,li)+f.off : e.base+f.off;
    const a = drill? "ether" : e.anchor;
    return `(${a}[${o}:4] == ${hex(hi)} and ${a}[${o+4}:2] == ${hex(lo)})`;
  }
  else if(f.kind==="ipv6"){
    const w = ipv6words(sel.dispVal); if(!w) return null;
    const o = drill? prefix(st,li)+f.off : e.base+f.off;
    const a = drill? "ether" : e.anchor;
    return "("+w.map((x,i)=>`${a}[${o+i*4}:4] == ${hex(x)}`).join(" and ")+")";
  }
  else val = +sel.val;
  const kw = drill? "ether" : e.anchor;
  const o  = drill? prefix(st,li)+f.off : e.base+f.off;
  if(f.mask){ const sh=f.shift||0; return `(${kw}[${o}:${win}] & ${hex(f.mask)}) == ${hex(val*Math.pow(2,sh))}`; }
  if(f.kind==="bitset"){ const m=sel.bitMask; return `(${kw}[${o}:${win}] & ${hex(m)}) == ${hex(m)}`; }
  return `${kw}[${o}:${win}] == ${(f.emitKind||f.kind)==="number"?val:hex(val)}`;
}
function guards(st){
  const ti = tunnelIdx(st); if(ti<0 || st.length<=ti+1) return [];   // guards protect inner layers only
  const g = [];
  const tun = ENTRIES[st[ti].eid];
  if(tun.locator) g.push({t:T("guard"), e:Array.isArray(tun.locator) ? (tun.locator.length===1 ? tun.locator[0] : "("+tun.locator.join(" or ")+")") : tun.locator});
  if(tun.pin && !sels.some(s=>st.findIndex(x=>x.uid===s.uid)===ti && tun.pinYield.includes(s.fid)))
    g.push({t:tun.pinLabel || T("optPin"), e:tun.pin});
  for(let i=ti+1;i<st.length;i++)
    if(ENTRIES[st[i].eid].anchor==="ip")
      g.push({t:T("ihlPin"), e:`(ether[${prefix(st,i)}] & 0x0f) == 5`});
  return g;
}
function compileGroup(st){
  const ti = tunnelIdx(st);
  const clauses = guards(st).map(g=>g.e);
  // VLAN slot: a VLAN layer declared before the tunnel (or with no tunnel)
  // always leads the expression — the `vlan` keyword shifts every following
  // protocol keyword (ip/tcp/port, including the tunnel locator) past the
  // 4-byte tag, while raw ether[] reads stay absolute. VLAN layers inside
  // the tunnel payload are plain drill layers (raw reads only).
  const vli = st.findIndex(s=>s.eid==="vlan" && (ti<0 || st.indexOf(s)<ti));
  const vsel = vli>=0 ? sels.find(s=>s.uid===st[vli].uid && s.fid==="vid") : null;
  // Locators: payload-anchored entries (ospf/dhcp/esp/gre/stp/lldp/vxlan)
  // must carry their locator clause, or udp[N]/ip[N] would match ANY udp/ip
  // packet. Mirrors bpf_compile: single locator bare, several as (a or b).
  const locs = [];
  const guarded = ti>=0 && st.length>ti+1;          // inner layers: guards() carry the tunnel locator
  for(const s of sels){
    const li = st.findIndex(x=>x.uid===s.uid);
    if(li<0 || (ti>=0 && li>ti) || (guarded && li===ti)) continue;
    const e = ENTRIES[st[li].eid];
    if(!e.locator) continue;
    const c = Array.isArray(e.locator)
      ? (e.locator.length===1 ? e.locator[0] : "("+e.locator.join(" or ")+")")
      : e.locator;
    if(!locs.includes(c)) locs.push(c);
  }
  for(const sl of st){                              // bpf_compile order: column layers,
    for(const f of ENTRIES[sl.eid].fields){         // registry declaration order within
      const s = sels.find(x=>x.uid===sl.uid && x.fid===f.id);
      if(!s || s===vsel) continue;                  // vsel is emitted below, in the VLAN slot
      const c = fieldClause(st, s); if(c) clauses.push(c);
    }
  }
  if(locs.length) clauses.unshift(...locs);
  if(vli>=0 && (clauses.length || vsel))
    clauses.unshift(vsel ? `vlan ${vsel.val}` : "vlan");
  return clauses.length? clauses.join(" and ") : null;
}
function compile(){
  // One operand per column; empty columns sit out. "not" negates the column
  // to its right (X not Y = X and not Y); grouping follows not > and > or
  // with explicit parentheses, mirroring libpcap precedence.
  const live = groups.map(g=>({op:g.op, x:compileGroup(g.layers)})).filter(o=>o.x);
  if(live.length<=1) return live.length ? live[0].x : null;
  const wrap = s => s.includes(" ") ? "("+s+")" : s;
  const orSegs = [[]];
  live.forEach(o=>{
    if(o.op==="or" && orSegs[orSegs.length-1].length) orSegs.push([]);
    orSegs[orSegs.length-1].push(o);
  });
  return orSegs.map(seg=>{
    const parts = seg.map((o,i)=> i && o.op==="not" ? "(not "+wrap(o.x)+")" : wrap(o.x));
    if(orSegs.length===1) return parts.join(" and ");   // no lone outer parens
    return parts.length>1 ? "("+parts.join(" and ")+")" : parts[0];
  }).join(" or ");
}

/* ---------- layout: fields never split ----------
   Column = MSB-first bit position: off*8 + (win*8 - mask.bitlen); width = popcount(mask).
   A field that fits inside one 32-bit word row sits in the word grid at its bit
   column (IP/TCP/UDP-style headers stay the classic textbook grid). A field that
   would cross a row boundary (MAC 48b, IPv6 addresses 128b) gets a whole row of
   its own — the textbook convention of one address per row. Wrapping therefore
   only ever happens BETWEEN fields, never inside one. */
const bitlen = v => v.toString(2).length;
const popcount = v => v.toString(2).replace(/0/g,"").length;
function fieldBits(f){
  const total = (f.win||f.len)*8;
  if(f.mask) return {start: f.off*8 + (total - bitlen(f.mask)), width: popcount(f.mask)};
  return {start: f.off*8, width: total};
}
function layoutRows(e){
  const out=[], aligned={};
  for(const f of e.fields){
    const {start, width} = fieldBits(f);
    const r=Math.floor(start/32), c=start%32;
    if(c+width<=32)
      (aligned[r] ??= {sort:r*32, byte:r*4, grid:true, items:[]}).items.push({f, col:c, width});
    else
      out.push({sort:start, byte:Math.floor(start/8), grid:false, items:[{f, col:0, width}]});
  }
  for(const k of Object.keys(aligned)) out.push(aligned[k]);
  out.sort((a,b)=>a.sort-b.sort);
  return out;
}

/* ---------- render ---------- */
function renderAll(){ renderChrome(); renderPalette(); renderStack(); renderChips(); renderExpr(); focusCell(); }
function focusCell(){
  const c = document.getElementById("cellEdit");
  if(c){ c.focus(); if(c.select) try{ c.select(); }catch(e){} }
}
function renderPalette(){
  // Accordion rail: exactly ONE family is expanded at a time — opening a
  // group closes the previous one, and open state changes only by click.
  // Picking a brick never collapses the group it came from (nothing
  // re-shapes famOpen behind the user's back). Search is the one
  // exception: with a term every group holding matches is expanded;
  // clearing the search restores the accordion state.
  const q = palFilter.trim().toLowerCase();
  const rail = Object.keys(FAM).map(fam=>{
    const open = q ? true : famOpen===fam;
    const arrow = `<span class="arr">${open?"▾":"▸"}</span>`;
    if(fam==="custom"){
      if(q) return "";
      return `<div class="pgroup ${open?"open":""}"><div class="pgrouplab" style="--fc:${FAM.custom.color}; color:${FAM.custom.color}" onclick="toggleFam('custom')">${arrow}<span>${L(FAM.custom.label)}</span></div>
        <div class="pbtns"><button style="--pc:${FAM.custom.color}" onclick="addCustom()">${T("customBtn")}</button></div></div>`;
    }
    const list = Object.entries(ENTRIES).filter(([,e])=>e.fam===fam && !e.custom);
    const shown = list.filter(([,e])=>!q || String(e.label).toLowerCase().includes(q));
    if(!shown.length) return "";
    const btns = shown.map(([id,e])=>`<button style="--pc:${FAM[fam].color}" onclick="addLayer('${id}')">${L(e.label)}</button>`).join("");
    return `<div class="pgroup ${open?"open":""}">
      <div class="pgrouplab" style="--fc:${FAM[fam].color}; color:${FAM[fam].color}" onclick="toggleFam('${fam}')">${arrow}<span>${L(FAM[fam].label)}</span><span class="cnt">${list.length}</span></div>
      <div class="pbtns">${btns}</div></div>`;
  }).join("");
  document.getElementById("palette").innerHTML =
    `<input id="palfilter" class="palfilter" placeholder="${T("searchPh")}" value="${palFilter}" oninput="filterPal(this.value)">` + rail;
}
function toggleFam(fam){        // accordion: opening one family collapses the rest
  famOpen = famOpen===fam ? null : fam;
  renderPalette();
}
function filterPal(v){
  palFilter = v; renderPalette();
  const inp = document.getElementById("palfilter");
  if(inp){ inp.focus(); inp.setSelectionRange(v.length, v.length); }
}
function addCustom(){
  const n = +prompt(T("customPrompt"),"12"); if(!n||n<1) return;
  const g = activeGroup();
  g.layers.push({uid:++uidSeq, eid:"custom", len:n}); selLayer=g.layers[g.layers.length-1].uid; selGroup=g.uid; renderAll();
}
/* Single-bit toggle mnemonic, in priority order: the label's "(X)"
   convention (GRE "Checksum Present (C)" -> C), a short field id which
   reads like the RFC name (dns qr -> QR, gtp pn_flag -> PN), else the
   label initial (Bottom of Stack -> B). No silent "?" fallback. */
function togLetter(f){
  const m = String(f.label).match(/\(([A-Za-z])\)/);
  if(m) return m[1];
  const id = String(f.id).replace(/_(flag|bit)$/,"");
  if(id.length<=2) return id.toUpperCase();
  return String(f.label).trim()[0].toUpperCase();
}
function cellHTML(layer, li, f, it, grid){
  const on = sels.some(s=>s.uid===layer.uid && s.fid===f.id);
  const width = it.width;
  const style = grid ? `grid-column:${it.col+1}/span ${width};` : "";
  if(f.excl && !f.excl.primitive)
    return `<div class="pc excl" title="${f.label}: ${L(f.excl.reason)} — ${T("exclConst")}" style="${style}">
      <span>🔒 ${f.label}</span><span class="bw">${width}b</span></div>`;

  const isEd = editing && editing.uid===layer.uid && editing.fid===f.id;
  const sel = sels.find(s=>s.uid===layer.uid && s.fid===f.id);
  const tog = f.emitKind==="number" && f.mask && (f.mask & (f.mask-1))===0 && f.max<=1
              && !f.excl;   // single-bit masked number (GRE C/K/S): letter toggle
  const tip = T("tipMeta")(f.label, f.off, width, f.kind)
    + (f.excl && f.excl.primitive ? `; ${T("prim1")}${f.excl.primitive}${T("prim2")}` : "")
    + (f.kind==="enum" ? T("clickDd") : (f.kind==="bitset"||tog) ? T("letTgl") : T("dblIn"));
  const pb = (f.excl && f.excl.primitive) ? `<span class="pb">${T("primBadge")}</span>` : "";

  if(isEd && (f.kind==="number"||f.kind==="ipv4"||f.kind==="ipv6"||f.kind==="mac")){
    const ph = f.kind==="ipv4"?"192.0.2.1":f.kind==="ipv6"?"2001:db8::1":f.kind==="mac"?"aa:bb:cc:dd:ee:ff":T("value");
    return `<div class="pc editing ${on?"on":""}" style="${style}" title="${tip}">
      <input id="cellEdit" value="${sel?sel.dispVal:""}" placeholder="${ph}" spellcheck="false"
        onkeydown="cellKey(event)" onblur="cellDone()"
        onclick="event.stopPropagation()" ondblclick="event.stopPropagation()"></div>`;
  }
  if(isEd && f.kind==="enum"){
    return `<div class="pc editing ${on?"on":""}" style="${style}" title="${tip}">
      <select id="cellEdit" onchange="commitValue(${layer.uid},'${f.id}',this.value)"
        onblur="if(editing){editing=null;renderAll()}" onclick="event.stopPropagation()">
        <option value="" disabled selected hidden>—</option>
        ${f.values.map(v=>`<option value="${v.v}" ${sel&&sel.val===v.v?"selected":""}>${v.l}</option>`).join("")}
      </select></div>`;
  }
  const mini = f.kind==="bitset" ? `<span class="mini">${f.bits.map(b=>
      `<i title="${b.l}" class="${sel&&sel.bitMask&b.m?"on":""}"
        onclick="event.stopPropagation(); toggleBit(${layer.uid},'${f.id}',${b.m})">${b.l[0]}</i>`).join("")}</span>` : "";
  const tletter = togLetter(f);
  const tmini = tog ? `<span class="mini"><i title="${f.label}" class="${sel&&sel.val===1?"on":""}"
      onclick="event.stopPropagation(); toggleOne(${layer.uid},'${f.id}')">${tletter}</i></span>` : "";
  // value stays visible in the cell: the cell IS the "what am I filtering on" display
  const lbl = sel
    ? `<span class="pv" title="${sel.dispVal}">${sel.dispVal}</span>${mini}${tmini}<span class="pl">${pb?pb+" ":""}${f.label} · ${width}b</span>`
    : `<span>${pb?pb+" ":""}${f.label}</span>${mini}${tmini}<span class="bw">${width}b</span>`;
  const act = f.kind==="enum"
    ? `onclick="pickField(${layer.uid},'${f.id}')"`
    : ((f.kind==="bitset"||tog) ? "" : `ondblclick="pickValue(${layer.uid},'${f.id}')"`);
  return `<div class="pc ${isEd?"editing":""} ${on?"on":""}" style="${style}" ${act} title="${tip}">${lbl}</div>`;
}
function gridHTML(layer, li, e){
  const rows = layoutRows(e);
  for(const x of e.excluded||[])
    rows.push({sort:x.off*8, byte:x.off, grid:false, exLabel:`${x.label} · ${x.len}B`, reason:x.reason});
  rows.sort((a,b)=>a.sort-b.sort);
  if(e.tail) rows.push({byte:null, grid:false, tailRow:true});
  const firstAlign = rows.findIndex(r=>r.grid);   // the one 32-bit ruler sits over the first word row
  let gut = "", body = "";
  rows.forEach((r,i)=>{
    const ruler = i===firstAlign
      ? `<div class="pruler"><div class="p32"><span class="ah">◄</span>${T("w32")}<span class="ah">►</span></div>
         <div class="pticks"><span>8</span><span>8</span><span>8</span><span>8</span></div></div>`
      : "";
    gut += `<span${ruler?` style="height:${38+32}px"`:""}>${r.byte ?? ""}</span>`;
    if(r.exLabel){
      body += `<div class="pfullrow"><div class="pc excl" title="${L(r.reason)} — ${T("notFilterable")}">${r.exLabel}</div></div>`;
      return;
    }
    if(r.tailRow){
      body += `<div class="pfullrow"><div class="pc tail" title="${L(e.tail.note)}">🔒 ${T("tailVar")(L(e.tail.label) || "Options + Padding")}</div></div>`;
      return;
    }
    const cells = r.items.map(it=>cellHTML(layer, li, it.f, it, r.grid)).join("");
    body += ruler + (r.grid ? `<div class="pgridrow">${cells}</div>` : `<div class="pfullrow">${cells}</div>`);
  });
  return `<div class="pwrap"><div class="gut">${gut}</div><div class="pbody">${body}</div></div>`;
}
/* ---------- in-cell editing: dblclick inputs values, click opens dropdowns, letters toggle bits ---------- */
function pickField(uid, fid){       // enum: single click opens in-place dropdown
  event.stopPropagation(); selLayer=uid;
  const layer = layerById(uid); if(!layer) return;
  const f = ENTRIES[layer.eid].fields.find(x=>x.id===fid);
  if(f.kind==="enum") editing={uid,fid};
  renderAll();
}
function pickValue(uid, fid){       // number / ipv4 / ipv6 / mac: double click inputs in place
  event.stopPropagation(); selLayer=uid; editing={uid,fid}; renderAll();
}
function commitValue(uid, fid, raw){
  raw = raw==null ? "" : (""+raw).trim();
  const layer = layerById(uid);
  if(!raw || !layer){ editing=null; renderAll(); return; }
  const f = ENTRIES[layer.eid].fields.find(x=>x.id===fid);
  const sel = {uid, fid, val:null, dispVal:null};
  if(f.kind==="enum"){ sel.val = +raw; sel.dispVal = (f.values.find(v=>v.v===+raw)||{l:raw}).l; }
  else if(f.kind==="mac"){ sel.dispVal = raw; sel.val = mac2int(raw); if(isNaN(sel.val)){editing=null;renderAll();return;} }
  else if(f.kind==="ipv4"){ sel.dispVal = raw; sel.val = ipv4val(raw); if(isNaN(sel.val)){editing=null;renderAll();return;} }
  else if(f.kind==="ipv6"){ sel.dispVal = raw;
    if(!ipv6words(raw)){ editing=null; renderAll(); return; } }
  else { sel.dispVal = raw; sel.val = +raw; if(isNaN(sel.val)){editing=null;renderAll();return;} }
  sels = sels.filter(s=>!(s.uid===uid && s.fid===fid)); sels.push(sel);
  autoLink(uid, f);
  editing=null; renderAll();
}
/* Successor linkage: a value that names the next protocol (EtherType, IP proto,
   IPv6 next header) re-shapes the layer that follows. Custom layers and tunnel
   envelopes are never silently destroyed — those surface a warning instead. */
function autoLink(uid, f){
  const succ = f.successor; if(!succ) return;
  const sel = sels.find(s=>s.uid===uid && s.fid===f.id);
  if(!sel) return;
  const target = succ[sel.val];
  if(!target || !ENTRIES[target]) return;
  const st = stackOf(uid);
  const li = st.findIndex(s=>s.uid===uid);
  const next = st[li+1];
  if(!next){                                         // nothing follows: grow the column
    const layer = {uid:++uidSeq, eid:target, len:ENTRIES[target].len};
    st.push(layer); selLayer = layer.uid;
    return;
  }
  if(next.eid===target) return;
  const ne = ENTRIES[next.eid];
  if(ne.custom || ne.tunnel) return;                 // never silently destroy; structWarnings reports it
  next.eid = target; next.len = ENTRIES[target].len;
  sels = sels.filter(s=>s.uid!==next.uid);           // old header's fields do not exist in the new one
  if(editing && editing.uid===next.uid) editing=null;
}
function structWarnings(){
  const out=[];
  groups.forEach((g,gi)=>{
    const st = g.layers, tag = groups.length>1 ? T("colTag")(gi+1) : "";
    const ti0 = tunnelIdx(st);
    const tun0 = ti0>=0 ? ENTRIES[st[ti0].eid] : null;
    if(tun0 && tun0.pin && st.length>ti0+1
       && sels.some(s=>s.uid===st[ti0].uid && tun0.pinYield.includes(s.fid)))
      out.push({warn:true, m: (L(tun0.pinWarn) || T("pinWarnGeneric"))+tag});
    for(const s of sels){
      const li = st.findIndex(x=>x.uid===s.uid); if(li<0) continue;
      const e = ENTRIES[st[li].eid];
      const f = e.fields.find(x=>x.id===s.fid);
      if(!f || !f.successor) continue;
      const target = f.successor[s.val];
      if(!target || !ENTRIES[target]) continue;
      const next = st[li+1];
      if(next && next.eid!==target)
        out.push({warn:true, m:T("warnMis")(L(e.label), f.label, s.dispVal) + " → " + L(ENTRIES[target].label) + T("warnTail") + L(ENTRIES[next.eid].label) + tag});
    }
  });
  return out;
}
function toggleBit(uid, fid, m){    // letter boxes toggle directly: click = select, click again = clear
  const layer = layerById(uid); if(!layer) return;
  const f = ENTRIES[layer.eid].fields.find(x=>x.id===fid);
  let sel = sels.find(s=>s.uid===uid && s.fid===fid);
  if(!sel){ sels.push({uid, fid, val:m, bitMask:m, dispVal:f.bits.find(b=>b.m===m).l}); }
  else{
    const nb = sel.bitMask ^ m;
    if(!nb) sels = sels.filter(s=>s!==sel);
    else{ sel.bitMask=nb; sel.val=nb; sel.dispVal=f.bits.filter(b=>nb&b.m).map(b=>b.l).join("+"); }
  }
  renderAll();
}
function toggleOne(uid, fid){        // single-bit masked number (GRE C/K/S): click toggles the bit
  const layer = layerById(uid); if(!layer) return;
  const f = ENTRIES[layer.eid].fields.find(x=>x.id===fid);
  const letter = togLetter(f);
  let sel = sels.find(s=>s.uid===uid && s.fid===fid);
  if(sel) sels = sels.filter(s=>s!==sel);
  else sels.push({uid, fid, val:1, dispVal:letter});
  renderAll();
}
function cellKey(e){
  if(e.key==="Enter") commitValue(editing.uid, editing.fid, e.target.value);
  else if(e.key==="Escape"){ editing=null; renderAll(); }
}
function cellDone(){
  if(!editing) return;
  const c = document.getElementById("cellEdit");
  if(c && (""+c.value).trim()) commitValue(editing.uid, editing.fid, c.value);
  else { editing=null; renderAll(); }
}
function layerHTML(st, s, i, ti, extra){
  const e = ENTRIES[s.eid], drill = ti>=0 && i>ti;
  const body = e.fields.length
    ? gridHTML(s, i, e)
    : `<div style="color:var(--muted); font-size:12px; padding:4px 8px 10px">${T("noFields")}</div>`;
  return `<div class="lrow ${selLayer===s.uid?"sel":""}" data-uid="${s.uid}" style="--lc:${FAM[e.fam].color}" onclick="layerClick(${s.uid})"
    onmousedown="armDrag(event,this)" ondragstart="dragStart(event,${s.uid})" ondragend="dragEnd()"
    ondragover="rowDragOver(event,${s.uid})" ondrop="rowDrop(event)">
    <div class="lhead" title="${T("dragTt")}"><b>${L(e.label)}</b>
      <span class="meta">${s.len}B · ${T("offset")} ${prefix(st,i)}${drill?T("drillL"):""}${e.tunnel?T("tunnelL"):""}</span>
      <span class="del" onclick="event.stopPropagation(); delLayer(${s.uid})">×</span>
    </div>
    ${body}${extra||""}
  </div>`;
}
function layerClick(uid){
  // Layer selection must NOT re-render the tree: a rebuild between the two
  // clicks of a double-click would land on a fresh node and kill dblclick.
  const inner = event.target.closest(".lrow");
  if(inner && +inner.dataset.uid !== uid) return;   // let the innermost row handle it
  selLayer = uid;
  document.querySelectorAll(".lrow").forEach(r=>r.classList.toggle("sel", r.dataset.uid==uid));
}
function renderStack(){
  let html = "";
  groups.forEach((g,gi)=>{
    if(gi>0){
      const tt = g.op==="or" ? T("opTtOr") : g.op==="not" ? T("opTtNot") : T("opTtAnd");
      html += `<div class="opbar ${g.op}" title="${tt}" onclick="cycleOp(${g.uid})"><b>${g.op}</b></div>`;
    }
    html += colHTML(g, gi);
  });
  html += `<button class="addcol" title="${T("addColTt")}" onclick="addColumn()">+</button>`;
  document.getElementById("stack").innerHTML = html;
}
function colHTML(g, gi){
  const st = g.layers, ti = tunnelIdx(st);
  let body = "";
  for(let i=0;i<st.length;i++){
    const e = ENTRIES[st[i].eid];
    if(e.tunnel){
      // The inner packet is the tunnel's PAYLOAD: nest it inside the tunnel's
      // own frame, like the textbook VXLAN figure (inner frame inside the envelope).
      const inner = st.slice(ti+1).map((s,j)=>layerHTML(st, s, ti+1+j, ti)).join("")
        || `<div style="padding:10px; color:var(--muted); font-size:12px">${T("innerEmpty")}</div>`;
      const wrap = `<div class="innerbox" style="--tc:${FAM[e.fam].color}">
        <div class="innerlab">${T("inner").replace("${label}", L(e.label))}</div>${inner}</div>`;
      body += layerHTML(st, st[i], i, ti, wrap);
      break;                      // everything past the envelope is nested above
    }
    body += layerHTML(st, st[i], i, ti);
  }
  if(!st.length) body = `<div class="colempty">${T("colEmpty")}</div>`;
  const tot = st.length ? `<div class="total">${T("total")(prefix(st, st.length))}</div>` : "";
  return `<div class="col ${st.length?"":"empty"} ${g.uid===selGroup?"on":""}" data-gid="${g.uid}"
    onclick="colClick(${g.uid})" ondragover="colDragOver(event)" ondrop="colDrop(event)">
    <div class="colhead"><span>#${gi+1}</span><span class="x" title="${T("colDelTt")}" onclick="event.stopPropagation(); delColumn(${g.uid})">×</span></div>
    ${body}${tot}</div>`;
}
function renderChips(){
  const w = structWarnings().map(x=>`<span class="chip ${x.warn?"warn":"hint"}" title="${x.warn?T("warnTitle"):T("hintTitle")}">${x.warn?"⚠":"💡"} ${x.m}</span>`);
  let g = "";
  groups.forEach((gr,gi)=>{
    const tag = groups.length>1 ? T("colTag")(gi+1) : "";
    for(const x of guards(gr.layers))
      g += `<span class="chip guard">🛡 ${x.t}${tag}: <code>${x.e}</code></span>`;
  });
  const c = sels.map((s,i)=>{
    const layer = layerById(s.uid); if(!layer) return "";
    const e = ENTRIES[layer.eid], f = e.fields.find(x=>x.id===s.fid);
    return `<span class="chip field">${L(e.label)}.${f.label} = ${s.dispVal} <span class="x" onclick="sels.splice(${i},1);renderAll()">×</span></span>`;
  }).join("");
  document.getElementById("chips").innerHTML = (w.join("")+g+c) || `<span style="color:var(--muted);font-size:12px">${T("noneYet")}</span>`;
}
function renderExpr(){
  const ex = compile();
  document.getElementById("expr").textContent = ex ?? T("noneYet");
  const drill = groups.some(gr=>{
    const ti = tunnelIdx(gr.layers);
    return ti>=0 && gr.layers.some((l,i)=>i>ti && sels.some(s=>s.uid===l.uid));
  });
  const badge = document.getElementById("modeBadge");
  badge.className = "mode "+(drill?"drill":"native");
  badge.textContent = drill?T("modeDrill"):T("modeNative");
  document.getElementById("exprNote").textContent = ex ? (groups.some(gr=>tunnelIdx(gr.layers)>=0)
    ? T("noteDrill")
    : T("noteNative")) : "";
}
/* Localize chrome before the registry arrives: title, section headers,
   language button and the empty-state expression text paint immediately;
   the stack card holds a spinner + progress bar until the registry is in. */
renderChrome(); renderExpr();
document.getElementById("loadText").textContent = T("loading");
loadEntries().then(()=>{ ready = true; renderAll(); }).catch(()=>{
  // fetch needs HTTP (file:// refuses): tell the user how to serve the repo
  document.getElementById("stack").innerHTML =
    `<div style="padding:20px;color:#b91c1c;font-size:13px;white-space:pre-line">${T("loadFail")}</div>`;
});
</script>
